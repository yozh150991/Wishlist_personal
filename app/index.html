<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Одна мова навмисне: сторінка статична, а мову інтерфейсу обирає вже
         застосунок. Українська — мова за замовчуванням проєкту. -->
    <meta
      name="description"
      content="Приватні списки бажань: ви бачите все, рідні — лише те, чим ви поділились за секретним посиланням."
    />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Запасний колір системних панелей на час до першого рендера; далі його
         ставить ThemeProvider із живого --color-bg активної палітри, щоб
         значення кольору лишалося рівно в одному файлі (styles/tokens.css). -->
    <meta name="theme-color" content="#f5ead8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221f1b" media="(prefers-color-scheme: dark)" />
    <title>Wishlist</title>
    <script>
      // Схема, тема й версія дизайну застосовуються до першого рендера, щоб не
      // блимав чужий вигляд. Усі три атрибути ставляться завжди: токени лежать
      // під [data-scheme][data-theme], і без пари селектор не влучить, а шар v2
      // чіпляється за [data-design].
      try {
        var d = document.documentElement.dataset;
        var t = localStorage.getItem('wl.theme') || 'system';
        var dark = t === 'dark' ||
          (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        d.theme = dark ? 'dark' : 'light';
        var s = localStorage.getItem('wl.scheme');
        d.scheme = s === 'slyva' || s === 'vuhil' ? s : 'sage';
        // ?design=v1 — аварійний вихід із v2. v2 має власні екрани, тож
        // перемкнутися зсередини не буде чим, якщо вона впаде на першому
        // рендері. Тут це працює ще до React. Параметр одразу прибираємо
        // з адреси, щоб він не поїхав далі в чужому посиланні.
        var u = new URL(location.href);
        var q = u.searchParams.get('design');
        if (q === 'v1' || q === 'v2') {
          localStorage.setItem('wl.design', q);
          u.searchParams.delete('design');
          history.replaceState(null, '', u.pathname + u.search + u.hash);
        }
        d.design = localStorage.getItem('wl.design') === 'v2' ? 'v2' : 'v1';
      } catch (_) {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.dataset.scheme = 'sage';
        document.documentElement.dataset.design = 'v1';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
