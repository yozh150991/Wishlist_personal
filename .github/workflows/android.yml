# Wishlist для Android (android/, ADR-080, ADR-081): сам Wishlist (TWA) і
# «У вішліст» у «Поділитися» в одному APK.
#
# Готовий файл — Actions → цей запуск → Artifacts → wishlist-android
# (zip із wishlist.apk). Підписана збірка з main ще й іде в GitHub Release
# android-v<versionName> (ADR-082): постійне посилання
# releases/latest/download/wishlist.apk відкривається без акаунта GitHub.
# Окремо від ci.yml: застосунок і сервіси від APK не залежать, а йому потрібні
# лише Node (для grab.js) і JDK.
#
# Підпис — секрети ANDROID_KEYSTORE_BASE64 і ANDROID_KEYSTORE_PASSWORD
# (docs/DEPLOY.md, розділ 14). Без них збирається debug-APK тимчасовим
# ключем: працює, але з рядком адреси вгорі й без оновлення поверх.
name: android

on:
  push:
    paths:
      - 'android/**'
      - 'app/src/lib/bookmarklet.ts'
      - 'app/scripts/build-android-grab.mjs'
      - 'app/public/.well-known/assetlinks.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'app/src/lib/bookmarklet.ts'
      - 'app/scripts/build-android-grab.mjs'
      - 'app/public/.well-known/assetlinks.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      # Створити Release з APK (останній крок, лише з main).
      contents: write
    steps:
      - uses: actions/checkout@v4

      # grab.js — це код закладки з bookmarklet.ts. Змінили закладку й не
      # оновили файл — застосунок читав би сторінку старими правилами.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Залежності застосунку
        working-directory: app
        run: npm ci
      - name: grab.js збігається з bookmarklet.ts
        working-directory: app
        run: npm run build:android-grab -- --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ підпису
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wishlist.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Секрету ANDROID_KEYSTORE_BASE64 немає — збираю debug-APK тимчасовим ключем: рядок адреси вгорі, поверх не оновлюється (DEPLOY.md, розділ 14)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # bash, а не ./gradlew: з Windows біт виконання файлу може загубитися.
      - name: Збірка підписаного APK
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_wishlistKeystore: ${{ runner.temp }}/wishlist.jks
          ORG_GRADLE_PROJECT_wishlistKeystorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          bash ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/wishlist.apk"

      - name: Збірка debug-APK (без ключа)
        if: steps.key.outputs.signed != 'true'
        working-directory: android
        run: |
          bash ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/wishlist.apk"

      # Відбиток ключа, яким підписано APK, мусить бути в assetlinks.json —
      # інакше Chrome не впізнає застосунок і покаже рядок адреси.
      - name: Відбиток ключа є в assetlinks.json
        if: steps.key.outputs.signed == 'true'
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          SHA=$("$APKSIGNER" verify --print-certs "$RUNNER_TEMP/wishlist.apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "Відбиток ключа в APK: $SHA"
          if ! grep -q "$SHA" app/public/.well-known/assetlinks.json; then
            echo "::error file=app/public/.well-known/assetlinks.json::Відбитка $SHA немає в assetlinks.json — встав його в sha256_cert_fingerprints (DEPLOY.md, розділ 14)."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wishlist-android
          path: ${{ runner.temp }}/wishlist.apk
          if-no-files-found: error

      # Одна версія — один Release: той самий versionName удруге не
      # перезаписується, щоб уже роздане посилання на версію не змінило вміст.
      # Нова версія — підняти versionCode і versionName у build.gradle.kts.
      - name: Release з wishlist.apk
        if: steps.key.outputs.signed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "::error file=android/app/build.gradle.kts::Не знайшов versionName"
            exit 1
          fi
          TAG="android-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG уже є — APK у ньому не міняю. Нова версія: підніми versionCode і versionName в android/app/build.gradle.kts."
            exit 0
          fi
          gh release create "$TAG" "$RUNNER_TEMP/wishlist.apk" \
            --target "$GITHUB_SHA" \
            --title "Wishlist для Android $VERSION" \
            --latest \
            --notes "Встановлення й оновлення — у Wishlist на Android: Налаштування → «Застосунок на телефоні». Що змінилось — CHANGELOG.md. Постійне посилання на останню версію: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/wishlist.apk"
          echo "Release $TAG: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
