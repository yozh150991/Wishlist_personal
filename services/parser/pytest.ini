[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Корінь сервісу в sys.path: інакше `pytest` (не `python -m pytest`) не знаходить пакет app.
pythonpath = .
# Живий прогін по магазинах (ROADMAP 8.3) — лише вручну: pytest -m live.
# Останній -m у командному рядку перемагає цей.
addopts = -m "not live"
markers =
    live: живі сторінки магазинів з tests/shop-links.txt; не в CI
